<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>單字背起來 · 英文單字學習</title>
<link rel="stylesheet" href="style.css?v=34" />
<link rel="manifest" href="manifest.json?v=34" />
<meta name="theme-color" content="#2f7a86" />
<link rel="icon" href="icons/icon-192.png?v=34" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=34" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="單字背起來" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <button id="menu-toggle-btn" type="button" class="menu-toggle-btn" aria-label="選單">☰</button>
      <h1>📘 單字背起來</h1>
      <div id="auth-area" class="auth-area">
        <button id="auth-toggle-btn" type="button" class="auth-btn">🔒 登入以同步</button>
      </div>
    </div>

    <div id="auth-panel" class="auth-panel hidden">
      <p class="import-hint">登入後單字本會同步到雲端，不同裝置登入同一個帳號就能看到同一份資料。</p>
      <input id="auth-email" type="email" placeholder="Email" autocomplete="email" />
      <input id="auth-password" type="password" placeholder="密碼（至少 6 碼）" autocomplete="current-password" />
      <div class="auth-actions">
        <button id="auth-login-btn" type="button" class="primary">登入</button>
        <button id="auth-signup-btn" type="button">註冊新帳號</button>
      </div>
      <div id="auth-status" class="status"></div>
    </div>

    <nav class="tabs" id="tabs-menu">
      <button class="tab-btn active" data-tab="search">查單字</button>
      <button class="tab-btn" data-tab="list">我的單字本</button>
      <button class="tab-btn" data-tab="review">
        今日複習 <span id="due-badge" class="badge hidden">0</span>
      </button>
      <button class="tab-btn" data-tab="flashcards">字卡</button>
      <button class="tab-btn" data-tab="calendar">日曆</button>
      <button class="tab-btn" data-tab="stats">統計</button>
    </nav>
  </header>

  <main>
    <!-- 查單字 -->
    <section id="tab-search" class="tab-panel active">
      <form id="search-form" class="search-form">
        <input
          id="search-input"
          type="text"
          placeholder="輸入你不會的英文單字或片語，例如 ubiquitous"
          autocomplete="off"
        />
        <button type="submit">查詢</button>
      </form>
      <div id="search-status" class="status"></div>
      <div id="search-result"></div>
    </section>

    <!-- 我的單字本 -->
    <section id="tab-list" class="tab-panel">
      <div class="list-toolbar">
        <input id="list-filter" type="text" placeholder="搜尋單字本..." />
        <button id="import-toggle-btn" type="button">＋ 批次匯入單字</button>
        <button id="backfill-zh-btn" type="button">補上缺少的中文</button>
      </div>
      <div id="backfill-status" class="status"></div>

      <div id="import-panel" class="import-panel hidden">
        <p class="import-hint">貼上單字或片語清單，用逗號、頓號或換行分隔，會自動逐一查詢字典並加入單字本。</p>
        <textarea id="import-textarea" rows="5" placeholder="例如：slight, trivial, pivotal, kick the bucket"></textarea>
        <div class="import-actions">
          <button id="import-start-btn" type="button" class="primary">開始匯入</button>
          <span id="import-progress" class="import-progress"></span>
        </div>
        <div id="import-result"></div>
      </div>

      <div id="word-list" class="word-grid"></div>
      <p id="list-empty" class="empty-hint hidden">
        還沒有收藏的單字。到「查單字」頁面搜尋並加入單字本吧！
      </p>
    </section>

    <!-- 今日複習 -->
    <section id="tab-review" class="tab-panel">
      <div id="review-area"></div>
    </section>

    <!-- 字卡 -->
    <section id="tab-flashcards" class="tab-panel">
      <div id="flashcard-area"></div>
    </section>

    <!-- 日曆 -->
    <section id="tab-calendar" class="tab-panel">
      <div id="calendar-area"></div>
    </section>

    <!-- 統計 -->
    <section id="tab-stats" class="tab-panel">
      <div id="stats-area" class="stats-grid"></div>
    </section>
  </main>
</div>

<script type="module" src="js/app.js?v=34"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  }
</script>
</body>
</html>
